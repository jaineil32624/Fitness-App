name: Bug report
description: Report a reproducible Repwise issue
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the expected behavior and steps to reproduce.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove personal data before sharing.
    validations:
      required: false
